[tool.isort]
py_version = "311"
combine_as_imports = true
filter_files = true
force_grid_wrap = false
line_length = 120
multi_line_output = 5
include_trailing_comma = true
lines_after_imports = 2
skip_glob = "venv/*"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint.isort]
combine-as-imports = true
#filter-files = true
#force-grid-wrap = false
#multi-line-output = 5
#include-trailing-comma = true
lines-after-imports = 2
#skip-glob = "venv/*"
